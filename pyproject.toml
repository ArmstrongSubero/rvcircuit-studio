[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rvcircuit-studio"
version = "1.1.0"
description = "Desktop CircuitPython IDE with source-level debugger, serial REPL, plotter, and library manager"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Armstrong Subero"}
]
keywords = ["circuitpython", "ide", "microcontroller", "embedded", "education"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Education",
]
dependencies = [
    "PySide6>=6.4",
    "pyserial>=3.5",
    "pyqtgraph>=0.13",
    "adafruit-board-toolkit>=1.0",
]

[project.urls]
Homepage = "https://rvembedded.com"
Repository = "https://github.com/ArmstrongSubero/rvcircuit-studio"
Issues = "https://github.com/ArmstrongSubero/rvcircuit-studio/issues"

[project.scripts]
rvcircuit-studio = "rvcircuit_studio.app:main"

[project.gui-scripts]
rvcircuit-studio-gui = "rvcircuit_studio.app:main"

[tool.setuptools.packages.find]
include = ["rvcircuit_studio*"]

# 398 non-Python files have to ship or the app starts with no icons, no font,
# no snippets, and no syntax highlighting. The stale copy only listed the
# qutepart syntax database.
[tool.setuptools.package-data]
"rvcircuit_studio" = [
    "snippets.json",
    "icons/*",
    "font/*",
    "LICENSES/*",
]
"rvcircuit_studio.qutepart" = [
    "syntax/data/**/*",
    "icons/*",
]
